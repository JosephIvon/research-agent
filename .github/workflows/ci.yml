name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Backend unit tests (no external services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Backend tests
        run: |
          uv run --extra dev pytest tests/ -v --ignore=tests/e2e/ --junitxml=pytest-report.xml || TESTS_FAILED=1
          if [ "${TESTS_FAILED:-0}" = "1" ]; then
            # 失败清单写入 annotation：匿名也能从 API 读到（日志下载需要登录）
            uv run python .github/scripts/parse_junit.py pytest-report.xml || true
            exit 1
          fi

  frontend:
    name: Frontend tests (node:test, yarn.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # frontend/yarn.lock is the only committed lockfile (package-lock.json is
      # gitignored), and frontend/Dockerfile installs with yarn 1.22.x, so the
      # test job must install the same way before `yarn test`.
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile
      - name: Frontend tests
        working-directory: frontend
        run: yarn test

  e2e-contract:
    name: E2E contract (docker backend, no LLM/search keys)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev

      # docker-compose.yml requires SEARXNG_SECRET (${SEARXNG_SECRET:?...}); .env is
      # gitignored, so CI generates an ephemeral one instead of committing it.
      - name: Generate ephemeral secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          searxng_secret="$(openssl rand -hex 32)"
          jwt_secret_key="$(openssl rand -hex 32)"
          {
            echo "SEARXNG_SECRET=${searxng_secret}"
            echo "JWT_SECRET_KEY=${jwt_secret_key}"
            # 容器内 APP_ENV=production，settings 会对缺失/占位 LLM 密钥 fail-closed。
            # CI 拿不到真实配额，改用 fake provider 零密钥启动——
            # 这样 /health/ready 能真正校验配置链路，而不是靠放宽生产判据来迁就 CI。
            echo "LLM_PROVIDER=fake"
          } > .env
          echo "SEARXNG_SECRET=${searxng_secret}" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=${jwt_secret_key}" >> "$GITHUB_ENV"
          echo "LLM_PROVIDER=fake" >> "$GITHUB_ENV"
          echo "Generated ephemeral SEARXNG_SECRET / JWT_SECRET_KEY; LLM_PROVIDER=fake (.env stays untracked)"

      - name: Ensure writable output dir (bind mount uses host ownership)
        shell: bash
        run: |
          set -euo pipefail
          # /app/output 是 bind mount，容器内属主来自宿主机目录。CI runner 上
          # 若该目录由 docker daemon 以 root 新建，容器内非 root 的 appuser
          # 写不进去，报告落盘即 PermissionError（e2e-real-services 实测踩坑）。
          # .gitkeep 保证目录存在于 checkout，这里再显式放开写权限兜底。
          mkdir -p output
          chmod -R a+rwX output

      - name: Start SearXNG and Redis (docker compose v2, waits for healthchecks)
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          docker compose up -d --wait searxng redis

      - name: Start backend and assert it became healthy
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d research-agent
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health/ready >/tmp/backend-health.json 2>/dev/null; then
              ready=1
              break
            fi
            echo "waiting for backend readiness ... attempt ${i}/60"
            sleep 2
          done
          echo "--- /health/ready payload ---"
          cat /tmp/backend-health.json 2>/dev/null || echo "(no payload)"
          if [ "${ready}" -ne 1 ]; then
            # 就绪探针失败时把 /health 一并打出来：前者说明"不能干活"，后者说明"活着但依赖有问题"，
            # 两者指向完全不同的排查方向。
            echo "::error::Backend never became ready; the E2E contract suite would only skip."
            echo "--- /health payload (liveness) ---"
            curl -fsS --max-time 5 http://localhost:8080/health 2>/dev/null || echo "(no payload)"
            docker compose ps || true
            docker compose logs --tail 200 research-agent || true
            exit 1
          fi
          # Post-loop assertion: under `set -e` this fails the job if readiness is not green.
          curl -fsS --max-time 5 http://localhost:8080/health/ready >/dev/null
          echo "backend is ready"

      - name: Run E2E contract tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --extra dev pytest tests/e2e/ \
            -m "not real_services" \
            -v -rsx --strict-markers -p no:cacheprovider \
            --junitxml=pytest-report.xml || E2E_FAILED=1
          if [ "${E2E_FAILED:-0}" = "1" ]; then
            uv run python .github/scripts/parse_junit.py pytest-report.xml || true
            exit 1
          fi
        env:
          E2E_API_URL: http://localhost:8080
          E2E_FRONTEND_URL: http://localhost:3000
          # Skips are failures here: an unreachable backend can never be reported as green.
          E2E_REQUIRE_BACKEND: '1'

      - name: Report what ran and what did not
        if: always()
        run: |
          {
            echo "### E2E contract suite"
            echo "- RAN: \`pytest tests/e2e -m 'not real_services'\` (HTTP contract, no credentials)"
            echo "- NOT RUN: \`pytest tests/e2e -m real_services\` - needs real LLM/search keys"
            echo "  - run it from the \`e2e-real-services\` job (workflow_dispatch + MINIMAX_API_KEY secret)"
            echo "- Skips are failures in this job (\`E2E_REQUIRE_BACKEND=1\`); a zero-test run fails too."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  e2e-real-services:
    name: E2E real services (manual, needs LLM/search keys)
    # `secrets` is not available in a job-level `if`, so the run is dispatched
    # manually and the credential check happens as a failing step instead of a
    # silent skip.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Require LLM/search credentials
        shell: bash
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          {
            echo "### E2E real-services suite"
            echo "- RAN: \`pytest tests/e2e -m real_services\` (real search + LLM pipeline)"
            echo "- NOT RUN: the HTTP-contract suite is covered by the \`e2e-contract\` job"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${MINIMAX_API_KEY:-}" ]; then
            echo "::error::MINIMAX_API_KEY is not configured. This suite is NOT reported as passed."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Generate ephemeral secrets
        shell: bash
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "SEARXNG_SECRET=$(openssl rand -hex 32)"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "MINIMAX_API_KEY=${MINIMAX_API_KEY}"
            # 未配的 secret 是空串：绝不能写空值进 .env——空字符串会**覆盖**
            # settings 的默认值，客户端拿到空 base_url/model，表现为
            # "Connection error"（实锤：只配 API_KEY 时容器内全链路 429→Connection error）。
            # 只在非空时才写入，让默认值生效。
            if [ -n "${MINIMAX_BASE_URL:-}" ]; then
              echo "MINIMAX_BASE_URL=${MINIMAX_BASE_URL}"
            fi
            if [ -n "${MINIMAX_MODEL:-}" ]; then
              echo "MINIMAX_MODEL=${MINIMAX_MODEL}"
            fi
            # 真跑轨迹录制：LLM 调用按意图落盘 /app/recordings（bind mount
            # 到宿主 recordings/），跑完上传 artifact——失败的真跑可一键
            # 沉淀为离线回放 case（LLM_PROVIDER=fake LLM_FAKE_SCRIPT=<file>）
            echo "LLM_RECORD_SCRIPT=/app/recordings/e2e_run.json"
          } > .env
          echo "Generated ephemeral .env with provider credentials"

      - name: Ensure writable output/recordings dirs (bind mount uses host ownership)
        shell: bash
        run: |
          set -euo pipefail
          # /app/output 与 /app/recordings 是 bind mount，容器内属主来自宿主机目录。CI runner 上
          # 若该目录由 docker daemon 以 root 新建，容器内非 root 的 appuser
          # 写不进去，报告落盘即 PermissionError（e2e-real-services 实测踩坑）。
          # .gitkeep 保证目录存在于 checkout，这里再显式放开写权限兜底。
          mkdir -p output recordings
          chmod -R a+rwX output recordings

      - name: Start services and assert the backend became healthy
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait searxng redis
          docker compose up -d research-agent
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8080/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "waiting for backend health ... attempt ${i}/60"
            sleep 2
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error::Backend never became healthy; the credentialed suite cannot run."
            docker compose ps || true
            docker compose logs --tail 200 research-agent || true
            exit 1
          fi
          curl -fsS --max-time 5 http://localhost:8080/health >/dev/null

      - name: Run E2E real-services tests (skips are failures here)
        shell: bash
        run: |
          set -euo pipefail
          uv run --extra dev pytest tests/e2e/ \
            -m "real_services" \
            -v -rs --strict-markers -p no:cacheprovider -s \
            --junitxml=pytest-report.xml || REAL_FAILED=1
          if [ "${REAL_FAILED:-0}" = "1" ]; then
            uv run python .github/scripts/parse_junit.py pytest-report.xml || true
            exit 1
          fi
        env:
          E2E_API_URL: http://localhost:8080
          E2E_REQUIRE_BACKEND: '1'
          E2E_REQUIRE_REAL_SERVICES: '1'
          E2E_RUN_FULL_FLOW: '1'

      - name: Upload recorded LLM script (L3 -> L2 replay source)
        # 真跑即录：无论测试成败都上传（失败的真跑正是最想沉淀的轨迹）。
        # 录制文件直接可用作 LLM_FAKE_SCRIPT 离线回放。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-recordings
          path: recordings/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose down -v

  evals:
    name: Offline evals (deterministic, gate)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --extra dev
      # 阶段一门禁：注入通过率=1.00 与全量 case 完成是硬门槛；
      # 质量指标（引用三率/维度覆盖）与 baselines/v1.json 比对，回退只告警。
      # 夹具（含 llm.json）带 sha256 清单，被篡改即失败。
      - name: Run evals with gate
        run: uv run --extra dev python -m evals.runner --gate

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose interpolates the whole file at load time, so even `compose build`
      # needs SEARXNG_SECRET present.
      - name: Generate placeholder secrets for compose interpolation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
      - name: Build images
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          docker compose build